<!DOCTYPE html>
<html lang="zh‑CN">
<head>
  <meta charset="UTF‑8">
  <title>智能任务管理系统</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif;}
    body{max-width:800px;margin:30px auto;padding:0 20px;background:#f5f7fa;}
    h1{text-align:center;margin-bottom:24px;color:#222;}
    .add-box{background:#fff;padding:20px;border-radius:8px;margin-bottom:20px;box-shadow:0 1px 4px #00000015;}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
    input[type="text"]{flex:1;padding:10px 12px;border:1px solid #ddd;border-radius:6px;font-size:16px;min-width:200px;}
    select{padding:10px;border:1px solid #ddd;border-radius:6px;font-size:16px;}
    button{padding:10px 16px;border:none;border-radius:6px;cursor:pointer;font-size:15px;}
    .btn‑add{background:#2563eb;color:white;}
    .filter‑wrap{margin-bottom:16px;}
    .task‑item{background:#fff;padding:14px;border-radius:8px;margin‑bottom:10px;box-shadow:0 1px 3px #00000012;display:flex;justify‑content:space‑between;align‑items:center;flex‑wrap:wrap;gap:10px;}
    .task‑done .title{text‑decoration:line‑through;color:#888;}
    .tag‑high{color:#dc2626;}
    .tag‑mid{color:#d97706;}
    .tag‑low{color:#059669;}
    .btn‑toggle{background:#10b981;color:white;margin‑right:8px;}
    .btn‑del{background:#ef4444;color:white;}
  </style>
</head>
<body>
<h1>智能任务管理系统</h1>

<div class="add-box">
  <div class="row">
    <input id="titleInput" placeholder="输入任务标题">
    <select id="prioritySelect">
      <option value="high">高</option>
      <option value="mid">中</option>
      <option value="low">低</option>
    </select>
    <button class="btn‑add" onclick="addTask()">添加任务</button>
  </div>
</div>

<div class="filter‑wrap">
  <select id="filterSelect" onchange="loadTasks()">
    <option value="all">全部</option>
    <option value="high">高优先级</option>
    <option value="mid">中优先级</option>
    <option value="low">低优先级</option>
  </select>
</div>

<div id="taskList"></div>

<script>
async function loadTasks(){
  const filter = document.getElementById('filterSelect').value;
  const res = await fetch(`/api/tasks?priority=${filter}`);
  const tasks = await res.json();
  const dom = document.getElementById('taskList');
  dom.innerHTML = '';
  tasks.forEach(t=>{
    const div = document.createElement('div');
    div.className = 'task‑item' + (t.is_done ? ' task‑done' : '');
    let tagClass = t.priority==='high'?'tag‑high':t.priority==='mid'?'tag‑mid':'tag‑low';
    div.innerHTML = `
      <div>
        <div class="title">${escapeHtml(t.title)}</div>
        <div class="${tagClass}">优先级：${{high:'高',mid:'中',low:'低'}[t.priority]}</div>
      </div>
      <div>
        <button class="btn‑toggle" onclick="toggle(${t.id}, ${!t.is_done})">${t.is_done?'设未完成':'设完成'}</button>
        <button class="btn‑del" onclick="del(${t.id})">删除</button>
      </div>
    `;
    dom.appendChild(div);
  })
}

async function addTask(){
  const title = document.getElementById('titleInput').value.trim();
  const priority = document.getElementById('prioritySelect').value;
  if(!title) return alert('请输入任务');
  await fetch('/api/tasks',{
    method:'POST',
    headers:{'Content‑Type':'application/json'},
    body:JSON.stringify({title,priority})
  });
  document.getElementById('titleInput').value='';
  loadTasks();
}

async function toggle(id, val){
  await fetch(`/api/tasks/${id}`,{
    method:'PATCH',
    headers:{'Content‑Type':'application/json'},
    body:JSON.stringify({is_done:val})
  });
  loadTasks();
}

async function del(id){
  if(!confirm('确定删除？')) return;
  await fetch(`/api/tasks/${id}`,{method:'DELETE'});
  loadTasks();
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

loadTasks();
</script>
</body>
</html>
